name: Compilar Mascara MultiPainel (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout deste repositorio
        uses: actions/checkout@v4

      - name: Localizar o codigo do plugin (nao importa em qual pasta esta)
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter ShapeMasks.cpp | Select-Object -First 1
          if (-not $f) { throw "ShapeMasks.cpp nao foi encontrado no repositorio. Suba a pasta ShapeMasks." }
          Write-Host "Codigo encontrado em: $($f.DirectoryName)"
          "PLUGIN_DIR=$($f.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Baixar o SDK FFGL oficial da Resolume
        shell: pwsh
        run: |
          git clone https://github.com/resolume/ffgl.git ffgl-sdk
          git -C ffgl-sdk checkout 5b6e07840277df9ec35a228b9eb067636316350f

      - name: Copiar o plugin para dentro do SDK e gerar o projeto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ffgl-sdk/source/plugins/ShapeMasks | Out-Null
          Copy-Item "$env:PLUGIN_DIR/ShapeMasks.cpp" ffgl-sdk/source/plugins/ShapeMasks/
          Copy-Item "$env:PLUGIN_DIR/ShapeMasks.h" ffgl-sdk/source/plugins/ShapeMasks/
          $proj = Get-Content ffgl-sdk/build/windows/AddSubtract.vcxproj -Raw
          $proj = $proj -replace 'AddSubtract', 'ShapeMasks'
          $proj = $proj -replace 'AVFFGLADDSUBTRACT_EXPORTS', 'AVFFGLSHAPEMASKS_EXPORTS'
          $proj = $proj -replace '8EE99351-6226-415E-B2E9-2DCB2985F371', '7A1C9E52-3B6D-4F08-8E2A-5D4C1B9F6A33'
          Set-Content ffgl-sdk/build/windows/ShapeMasks.vcxproj $proj -Encoding UTF8

      - name: Preparar o MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar (Release x64)
        shell: pwsh
        run: |
          msbuild ffgl-sdk/build/windows/ShapeMasks.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: Enviar o .dll para download
        uses: actions/upload-artifact@v4
        with:
          name: Mascara-MultiPainel-dll
          path: ffgl-sdk/binaries/x64/Release/ShapeMasks.dll
          if-no-files-found: error
